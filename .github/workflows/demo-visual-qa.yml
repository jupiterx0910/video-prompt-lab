name: Demo Visual QA

on:
  push:
    branches:
      - agent/v2-compiler-evals

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/vpl-http.log 2>&1 &
          echo $! >/tmp/vpl-http.pid
          sleep 1

      - name: Render desktop and mobile screenshots
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chrome/Chromium binary found on runner"
            exit 1
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=1440,1100 \
            --screenshot=/tmp/demo-desktop.png http://127.0.0.1:8000/demo/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
            --virtual-time-budget=2500 --window-size=390,844 \
            --screenshot=/tmp/demo-mobile.png http://127.0.0.1:8000/demo/
          test -s /tmp/demo-desktop.png
          test -s /tmp/demo-mobile.png

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: demo-visual-qa
          path: |
            /tmp/demo-desktop.png
            /tmp/demo-mobile.png
          retention-days: 1
